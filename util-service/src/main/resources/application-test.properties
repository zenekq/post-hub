spring.application.name=util

# Server
APP_PORT=8185
server.port=${APP_PORT}

server.compression.enabled=true
server.compression.mime-types=application/json,text/html
server.compression.min-response-size=2048

# URL prefix; "/" - without prefix
server.servlet.context-path=/

# Disable banner
spring.main.banner-mode=off

# Spring uses virtual thread
spring.threads.virtual.enabled=true

# OSIV off
spring.jpa.open-in-view=false

# Spring security
spring.security.user.name=${SPRING_SECURITY_USER_NAME:user}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:testpassword}
spring.security.user.roles=${SPRING_SECURITY_USER_ROLES:USER}

# PostgreSQL
UTILS_SERVICE_DATABASE=utils_service
app.db.schema=v1_utils_service

# H2 Database (in-memory)
spring.datasource.url=jdbc:h2:mem:utils_service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Jpa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=${app.db.schema}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.order_inserts=true
spring.jpa.properties.hibernate.jdbc.order_updates=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${app.db.schema}
spring.flyway.clean-disabled=false
app.flyway.clean-on-start=true
app.db.insert-test-data-on-start=true

# End Points
end.points.actionLogs=/actionLogs
end.points.id=/{id}
end.points.all=/all
end.points.markAsRead=/markAsRead

# Swagger
swagger.servers.first=http://localhost:${APP_PORT}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
