spring.application.name=util

# Server
server.port=8185

server.compression.enabled=true
server.compression.mime-types=application/json,text/html
server.compression.min-response-size=2048

# URL prefix; "/" - without prefix
server.servlet.context-path=/

# Disable banner
spring.main.banner-mode=off

# Spring uses virtual thread
spring.threads.virtual.enabled=true

# OSIV off
spring.jpa.open-in-view=false

# Spring security
spring.security.user.name=${SPRING_SECURITY_USER_NAME:user}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:testpassword}
spring.security.user.roles=${SPRING_SECURITY_USER_ROLES:USER}

# PostgreSQL
UTILS_SERVICE_DATABASE=utils_service
DEFAULT_SCHEMA=v1_utils_service
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${UTILS_SERVICE_DATABASE}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Jpa
spring.jpa.properties.hibernate.default_schema=${DEFAULT_SCHEMA}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.order_inserts=true
spring.jpa.properties.hibernate.jdbc.order_updates=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${DEFAULT_SCHEMA}
spring.flyway.clean-disabled=false
app.flyway.clean-on-start=true

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
