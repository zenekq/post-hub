spring.application.name=iam-service

# Server
server.port=8189

# URL prefix; "/" - without prefix
server.servlet.context-path=/

# Disable banner
spring.main.banner-mode=off

# Spring uses virtual thread
spring.threads.virtual.enabled=true

# OSIV off
spring.jpa.open-in-view=false

# Spring security
spring.security.user.name=${SPRING_SECURITY_USER_NAME:user}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:testpassword}
spring.security.user.roles=${SPRING_SECURITY_USER_ROLES:USER}

# Jwt
jwt.secret=${JWT_SECRET}
jwt.lifetime=360000
jwt.expiration=604800

# PostgreSQL
POST_HUB_SERVICE_DATABASE=post_hub_local
DEFAULT_SCHEMA=v1_iam_service
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POST_HUB_SERVICE_DATABASE}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Jpa
spring.jpa.properties.hibernate.default_schema=${DEFAULT_SCHEMA}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.order_inserts=true
spring.jpa.properties.hibernate.jdbc.order_updates=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${DEFAULT_SCHEMA}
spring.flyway.clean-disabled=false
app.flyway.clean-on-start=true

# End Points
end.points.posts=/posts
end.points.id=/{id}
end.points.create=/create
end.points.all=/all
end.points.search=/search
end.points.users=/users
end.points.auth=/auth
end.points.login=/login
end.points.refresh.token=/refresh/token
end.points.register=/register
end.points.comments=/comments

# Swagger
swagger.servers.first=http://localhost:8189
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JSON Jackson
spring.jackson.mapper.sort-properties-alphabetically=false

# Logging
logging.level.com.posthub.iam=TRACE
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.post_hub.iam_service=DEBUG

spring.output.ansi.enabled=ALWAYS

logging.level.org.springframework.security.config.annotation.authentication=ERROR
# shorter log output
logging.pattern.console=%clr(%d{yy-MM-dd'T'HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(-){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}